# Render blueprint — free single-service deploy.
# The web service builds the Dockerfile (Express serves the client + API +
# WebSocket on one origin); a free Postgres backs it.
#
# Free-tier caveats: the web service sleeps after ~15 min idle (cold start
# ~1 min), and the free Postgres expires after 90 days. In-memory live-game
# state is lost on sleep/restart — fine for a demo/staging, NOT for holding
# real money. Keep TREASURY off real funds until on an always-on paid tier.

databases:
  - name: paipalace-db
    databaseName: paipalace
    user: paipalace
    plan: free
    region: oregon

services:
  - type: web
    name: paipalace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paipalace-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Generated by Render (don't reuse dev values)
      - key: JWT_SECRET
        generateValue: true
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      # Public, safe to commit
      - key: USDC_MINT
        value: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git)
      - key: SOLANA_RPC_URL
        sync: false
      - key: TREASURY_ADDRESS
        sync: false
      - key: TREASURY_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Optional live AI (blank = simulated engine)
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4
